<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AudiChess</title>
  <meta name="description" content="Play blind chess by voice with a simulated Alexa+ speaker. Just talk: no wake word needed. Voice by Amazon Nova 2 Sonic.">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='%23111827' stroke='%2300caff' stroke-width='8'/%3E%3C/svg%3E">
</head>
<body>
  <main class="room">
    <button id="device" class="device" data-state="off" aria-label="Echo speaker. Tap to mute or unmute.">
      <span class="ring" aria-hidden="true"><span class="ring-glow"></span><span class="ring-sweep"></span></span>
      <span class="device-top" aria-hidden="true"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
      <span class="device-body" aria-hidden="true"></span>
    </button>
    <div class="floor" aria-hidden="true"></div>
  </main>

  <!-- Browsers only allow the microphone and audio after a tap: one tap, then it's hands-free. -->
  <div id="start" class="start" role="dialog" aria-modal="true" aria-labelledby="start-title">
    <div class="start-card">
      <h1 id="start-title">AudiChess</h1>
      <p>Blind chess by voice, like a conversation. After you tap, just talk: <strong>“Let’s play chess.”</strong> No wake word needed. Tap the speaker (or press Esc) to interrupt her, or say “pause” to stop listening.</p>
      <button id="start-btn" class="start-btn">Tap to start</button>
      <p class="small" id="start-note">Needs a microphone. Speakers work; headphones are best.</p>
    </div>
  </div>

  <p id="live" class="sr-only" role="status" aria-live="polite"></p>

  <!-- Developer drawer: press D, on localhost only. -->
  <aside id="debug" class="debug" hidden aria-label="Debug log">
    <header>
      <strong>Debug</strong>
      <button id="new-session" type="button">New session</button>
      <button id="close-debug" type="button" aria-label="Close debug">×</button>
    </header>
    <form id="type-form" autocomplete="off">
      <input id="type-input" placeholder="Type instead of speaking" maxlength="500">
    </form>
    <ol id="debug-log"></ol>
  </aside>

  <script src="vendor/bedrock-sonic.js"></script>
  <script src="wake.js"></script>
  <script src="sonic.js"></script>
  <script src="debugscreen.js"></script>
  <script src="app.js"></script>
</body>
</html>
